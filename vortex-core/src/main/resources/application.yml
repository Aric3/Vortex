server:
    # 关闭时立即停止，不等待活跃请求（避免 SSE /stream/reports 长连接导致卡住 30 秒）
    shutdown: immediate

vortex:
    matching:
        shards: 8  # 订单事件分片数

spring:
    application:
        name: vortex-core
    datasource:
        hikari:
            connection-timeout: 30000
            maximum-pool-size: 4  # 提高以降低持久化背压，便于后续多消费者或并行批处理
        url: jdbc:sqlite:vortex.db
        driver-class-name: org.sqlite.JDBC
    threads:
        virtual:
            enabled: true
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

analytics:
    enabled: true
    refresh-interval-ms: 1000

# 行情来源统一配置：alltick（真实）与 simulation（模拟）
# source: real_only=仅真实 | simulated_only=仅模拟 | real_then_simulated=先真实再由模拟推进
quotation:
    enabled: true
    source: simulated_only
    alltick:
        quote-url: wss://quote.alltick.co/quote-stock-b-ws-api
        token: d809da32986f54f1a19ae469dd54a3d5-c-app
        # subscription-mode: tick=仅最新成交价 | handicap=仅买卖五档 | both=两者都订阅
        subscription-mode: tick
        symbols:
            - "600030.SH" # 中信证券
            - "600519.SH" # 贵州茅台    
            - "600036.SH" # 招商银行
            - "000001.SZ" # 平安银行
            - "000858.SZ" # 五粮液
            - "0700.HK" # 腾讯控股 (Tencent)
            - "AAPL.US" # 苹果公司 (Apple)
            
        heartbeat-interval-ms: 10000
        reconnect-interval-ms: 5000
    simulation:
        interval-ms: 1000 # 模拟行情间隔时间，单位：毫秒
        volatility: 0.01 # 模拟行情波动率
        trend: flat # 模拟行情趋势
        trend-step: 0.02 # 模拟行情趋势步长
        mean-reversion-rate: 0.1 # 模拟行情均值回归率
        default-initial-price: 10.0 # 模拟行情默认初始价格
        symbols:
            - "600030.SH" # 中信证券
            - "600519.SH" # 贵州茅台
            - "600036.SH" # 招商银行    
            - "000001.SZ" # 平安银行
            - "000858.SZ" # 五粮液
            - "0700.HK" # 腾讯控股 (Tencent)
            - "AAPL.US" # 苹果公司 (Apple)
        initial-price: # 模拟行情初始价格，格式：股票代码: 价格，如 "600030.SH": 27.0
            "600030.SH": 26.15
            "600519.SH": 1395.48
            "600036.SH": 39.16
            "000001.SZ": 10.82
            "000858.SZ": 101.17
            "0700.HK": 300.0
            "AAPL.US": 150.0

